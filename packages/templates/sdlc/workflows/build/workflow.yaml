apiVersion: nemia.dev/v1alpha1
kind: Workflow
metadata:
  name: build
  description: Build an accepted intent into working, reviewed code on main. Seldon writes the spec, which a person approves; Grace builds it; Agora reviews it and sends it back while a finding is worth a round, five at most; its pass files the landing, which the landing program makes with no gate, as quick's does. A change its card settles, which needs no design, goes through [`quick`](../quick/README.md), whatever its size, with no spec.
spec:
  needs:
    - name: gh
      message: "gh, the GitHub CLI, on the PATH, which pushes the run's branch, labels its pull request, watches its checks (the factory's ci-watch program) and lands it: needed only where github is true"
      check: "if [ \"${{ parameters.github }}\" = true ]; then command -v gh >/dev/null; fi"
      fixes:
        - message: "install the latest gh release for this machine into Nemia's tools folder, its sum checked against the release's checksums, with no sudo"
          command: "node \"$WF_CARRIED_FILES/needs.ts\" install-gh"
    - name: gh-sign-in
      message: "gh signed in to github.com with the workflow scope, which a push of a CI file takes: needed only where github is true"
      check: "if [ \"${{ parameters.github }}\" = true ]; then node \"$WF_CARRIED_FILES/needs.ts\" scope workflow; fi"
      fixes:
        - message: "sign gh in to GitHub in a browser: open https://github.com/login/device, type the code shown here and approve; gh then serves git's https sign-in"
          command: "gh auth login --hostname github.com --web --git-protocol https --scopes workflow </dev/null && gh auth setup-git"
          code: "[A-Z0-9]{4}-[A-Z0-9]{4}"
    - name: git-identity
      message: "git commits under the GitHub account gh is signed in to"
      check: "git config --global user.name >/dev/null && git config --global user.email >/dev/null"
      fills: git-identity
      fixes:
        - message: "set git's name and email from the GitHub account gh is signed in to: its name (its login where it has none) and its noreply address, <id>+<login>@users.noreply.github.com; where gh is not signed in, take the next fix, which asks for a name and an email"
          command: "node \"$WF_CARRIED_FILES/needs.ts\" identity"
    - name: github-server
      message: "the factory's github MCP server, added to the factory and signed in, through which Grace opens her pull request and Agora reads it and its checks: needed only where github is true. Add it on the factory's settings page, where Nemia's builtin github is offered, or by nemia factory server add, then sign it in there"
      check: "if [ \"${{ parameters.github }}\" = true ]; then nemia get mcpservers/github -n \"$WF_FACTORY\" -o name >/dev/null; fi"
    - name: browser
      message: "the Chromium build the steps' browser tools launch, which they look at the web app with"
      scope: repository
      check: "node \"$WF_CARRIED_FILES/needs.ts\" browser"
      fixes:
        - message: "install the Chromium build your browser tools' Playwright launches, with that Playwright's own installer, in the repository, as the user the daemon runs as"
          command: "node \"$WF_CARRIED_FILES/needs.ts\" browser --install"
  steps:
    - name: design
      place: git
      gate: true
      budget: 12
      reads:
        - costs
    - name: implement
      after:
        - design
      input:
        - design
      place: git
      budget: 50
      retries: 2
      checkFailurePolicy: { rules: [ { action: FailStep, onExitCodes: { operator: In, values: [78] } } ] }
      checks:
        - name: probe
          run: "node \"${WF_CARRIED_FILES:?nemia check: probe.ts is read from the frozen carried files of a run, which sets this: run this check in a run}/probe.ts\" check"
        - name: parts
          run: "node \"${WF_CARRIED_FILES:?nemia check: parts.ts is read from the frozen carried files of a run, which sets this: run this check in a run}/parts.ts\" check"
        - name: own
          run: "{ ${{ parameters.implementCheck }}; }"
        - name: push
          run: "if [ \"${{ parameters.github }}\" = true ]; then node \"${WF_CARRIED_FILES:?nemia check: pull-request.ts is read from the frozen carried files of a run, which sets this: run this check in a run}/pull-request.ts\" push --labels \"${{ parameters.pullRequestLabels }}\"; fi"
        - name: round
          run: "if [ \"${{ parameters.github }}\" = true ]; then { ${{ parameters.roundCheck }}; }; fi"
        - name: local
          run: "if [ \"${{ parameters.github }}\" = true ] && node \"${WF_CARRIED_FILES:?nemia check: pull-request.ts is read from the frozen carried files of a run, which sets this: run this check in a run}/pull-request.ts\" declares-ci; then echo 'nemia ci: the CI context judges this head'; else { ${{ parameters.localCheck }}; }; fi"
        - name: ci
          condition: ci
          enabled: "${{ parameters.github }}"
      overrides:
        mcp:
          - "${{ case(parameters.github, 'github', '') }}"
        claude:
          context: 400k
    - name: land
      after:
        - review
      place: git
      waitsFor:
        - "${{ case(parameters.github, 'turn', '') }}"
        - "${{ case(parameters.github, 'ci', '') }}"
        - landed
        - "${{ case(parameters.github, 'base-ci', '') }}"
    - name: review
      after:
        - implement
      input:
        - design
      place: git
      budget: 24
      loop: implement
      rounds: 5
      tally:
        - findings
        - findings.kind=placement
        - findings.missed
      overrides:
        mcp:
          - "${{ case(parameters.github, 'github', '') }}"
