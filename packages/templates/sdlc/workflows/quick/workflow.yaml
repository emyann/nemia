apiVersion: nemia.dev/v1alpha1
kind: Workflow
metadata:
  name: quick
  description: "Build a change a card settles, on main, with no spec: Grace plans and builds it in one session, Agora reads it as a second engineer would, and Otto lands it once that review passes. Nobody is asked to approve the landing — the review is what stands between the work and the base branch."
spec:
  steps:
    - name: implement
      place: git
      budget: 20
      retries: 2
      checkFailurePolicy: { rules: [ { action: FailStep, onExitCodes: { operator: In, values: [78] } } ] }
      check: "node \"${WF_WORKFLOW_FILES:?nemia check: change.ts is read from the frozen workflow files of a run, which sets this: run this check in a run}/change.ts\" size && node \"${WF_CARRIED_FILES:?nemia check: probe.ts is read from the frozen carried files of a run, which sets this: run this check in a run}/probe.ts\" check && node \"${WF_CARRIED_FILES:?nemia check: parts.ts is read from the frozen carried files of a run, which sets this: run this check in a run}/parts.ts\" check && { ${{ parameters.implementCheck }}; } && if [ \"${{ parameters.github }}\" = true ]; then node \"${WF_CARRIED_FILES:?nemia check: pull-request.ts is read from the frozen carried files of a run, which sets this: run this check in a run}/pull-request.ts\" push --labels \"${{ parameters.pullRequestLabels }}\" && node \"${WF_CARRIED_FILES:?nemia check: pull-request.ts is read from the frozen carried files of a run, which sets this: run this check in a run}/pull-request.ts\" wait --check \"${{ parameters.ciCheck }}\"; else { ${{ parameters.localCheck }}; }; fi"
      output:
        path: workflows/quick/implement.schema.json
      overrides:
        claude:
          context: 400k
    - name: land
      instruction:
        path: workflows/build/land.md
      after:
        - review
      place: git
      workspace: base
      budget: 10
      check: "if [ \"${{ parameters.github }}\" = true ]; then node \"${WF_CARRIED_FILES:?nemia check: landing.ts is read from the frozen carried files of a run, which sets this: run this check in a run}/landing.ts\" receipt --run \"$WF_RUN\" --check \"${{ parameters.ciCheck }}\" --wait-on-ci \"${{ parameters.landingWaitsOnCi }}\"; else { ${{ parameters.localCheck }}; }; fi"
    - name: review
      after:
        - implement
      place: git
      budget: 12
      loop: implement
      rounds: 2
      tally:
        - findings
        - findings.kind=placement
