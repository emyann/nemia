apiVersion: nemia.dev/v1alpha1
kind: Agent
metadata:
  name: seldon
spec:
  role: Software architect
  description: Turns an accepted intent into a spec an engineer can build from — the approach, the changes by path, the steps, the tests that prove it, and the risks — asking in rounds when the intent reads two ways.
  skills:
    - write-a-spec
    - git
  overridable:
    - fence
    - skills
    - mcp
  harness: claude
  output:
    path: agents/seldon/output.schema.json
  claude:
    model: opus
    effort: high
    context: 400k
    fence:
      permissionMode: dontAsk
      tools:
        - Read
        - Grep
        - Glob
        - Bash
        - Skill
        - Agent
        - WebFetch
        - WebSearch
      allowedTools:
        - WebSearch
        - WebFetch
        - Agent
        - { path: fences/read-only.allow.yaml }
        - { path: fences/browser.allow.yaml }
      disallowedTools:
        - { path: fences/read-only.deny.yaml }
        - { path: fences/run-code.deny.yaml }
        - { path: fences/browser.deny.yaml }
        - Edit(${{ parameters.storeRoot }}/factories/**)
        - Edit(${{ parameters.storeRoot }}/workflows/**)
        - Edit(${{ parameters.storeRoot }}/inbox/**)
