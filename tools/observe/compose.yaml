name: nemia-observe

services:
  lgtm:
    image: grafana/otel-lgtm@sha256:2de1094c593c671cbfca878a28ffcd7e46ff5e32f2ce966c0cf33003f6cf4266
    container_name: nemia-lgtm
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:4040:4040"
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/nemia/dashboards/system.json
      OTELCOL_EXTRA_ARGS: --config=/otel-lgtm/nemia/otelcol.yaml
      PROMETHEUS_EXTRA_ARGS: --storage.tsdb.retention.time=90d
    volumes:
      - ./provisioning/nemia.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/nemia.yaml:ro
      - ./dashboards:/otel-lgtm/nemia/dashboards:ro
      - ./otelcol.yaml:/otel-lgtm/nemia/otelcol.yaml:ro
      - ./tempo.yaml:/otel-lgtm/tempo-config.yaml:ro
      - data:/data

volumes:
  data:
