apiVersion: nemia.dev/v1alpha1
kind: Agent
metadata:
  name: seldon
spec:
  role: Software architect
  description: Turns an accepted intent into a spec an engineer can build from — the approach, the changes by path, the steps, the tests that prove it, and the risks — asking in rounds when the intent reads two ways.
  skills:
    - write-a-spec
    - git
  overridable:
    - fence
    - skills
    - mcp
  harness: claude
  output:
    path: agents/seldon/output.schema.json
  claude:
    model: opus
    effort: high
    context: 400k
    fence:
      permissionMode: dontAsk
      tools:
        - Read
        - Grep
        - Glob
        - Bash
        - Skill
        - Agent
        - WebFetch
        - WebSearch
      allowedTools:
        - WebSearch
        - WebFetch
        - Agent
        - Bash(git diff:*)
        - Bash(git diff-tree:*)
        - Bash(git log:*)
        - Bash(git show:*)
        - Bash(git show-ref:*)
        - Bash(git status:*)
        - Bash(git blame:*)
        - Bash(git grep:*)
        - Bash(git ls-files:*)
        - Bash(git ls-tree:*)
        - Bash(git cat-file:*)
        - Bash(git rev-parse:*)
        - Bash(git rev-list:*)
        - Bash(git merge-base:*)
        - Bash(git merge-tree:*)
        - Bash(git shortlog:*)
        - Bash(git describe:*)
        - Bash(git name-rev:*)
        - Bash(git for-each-ref:*)
        - Bash(git check-ignore:*)
        - Bash(git branch)
        - Bash(git branch --list:*)
        - Bash(git branch --contains:*)
        - Bash(git worktree list:*)
        - Bash(wc:*)
        - Bash(cut:*)
        - Bash(head:*)
        - Bash(tail:*)
        - Bash(cat:*)
        - Bash(ls:*)
        - mcp__playwright__browser_click
        - mcp__playwright__browser_close
        - mcp__playwright__browser_console_messages
        - mcp__playwright__browser_drag
        - mcp__playwright__browser_drop
        - mcp__playwright__browser_evaluate
        - mcp__playwright__browser_file_upload
        - mcp__playwright__browser_fill_form
        - mcp__playwright__browser_find
        - mcp__playwright__browser_handle_dialog
        - mcp__playwright__browser_hover
        - mcp__playwright__browser_navigate
        - mcp__playwright__browser_navigate_back
        - mcp__playwright__browser_network_request
        - mcp__playwright__browser_network_requests
        - mcp__playwright__browser_press_key
        - mcp__playwright__browser_resize
        - mcp__playwright__browser_select_option
        - mcp__playwright__browser_snapshot
        - mcp__playwright__browser_tabs
        - mcp__playwright__browser_take_screenshot
        - mcp__playwright__browser_type
        - mcp__playwright__browser_wait_for
      disallowedTools:
        - Bash(cd:*)
        - Bash(git grep *O*)
        - Bash(git grep *--op*)
        - Bash(*GIT_*)
        - Bash(*=* git *)
        - Bash(git *--output*)
        - Bash(git *--no-ind*)
        - Bash(git blame *--con*)
        - Bash(git grep -f*)
        - Bash(git grep * -f*)
        - Bash(wc *--f*)
        - Bash(gh *--web*)
        - Bash(gh * -w*)
        - Bash(gh *--watch*)
        - Bash(gh *--jq*)
        - Bash(gh * -q*)
        - Bash(gh *--template*)
        - Bash(gh * -t*)
        - Bash(gh *--repo*)
        - Bash(gh * -R*)
        - Bash(gh *//*)
        - Bash(gh * -c*)
        - Bash(*=* gh *)
        - mcp__playwright__browser_run_code_unsafe
        - mcp__playwright__browser_console_messages(filename:*)
        - mcp__playwright__browser_evaluate(filename:*)
        - mcp__playwright__browser_network_request(filename:*)
        - mcp__playwright__browser_network_requests(filename:*)
        - mcp__playwright__browser_snapshot(filename:*)
        - mcp__playwright__browser_take_screenshot(filename:*)
        - Edit(${{ parameters.storeRoot }}/factories/**)
        - Edit(${{ parameters.storeRoot }}/workflows/**)
        - Edit(${{ parameters.storeRoot }}/inbox/**)
