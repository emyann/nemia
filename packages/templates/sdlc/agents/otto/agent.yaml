apiVersion: nemia.dev/v1alpha1
kind: Agent
metadata:
  name: otto
spec:
  role: Release engineer
  description: Lands a run's result on the base branch the way its step says, writes the message that records what landed, or says why it cannot.
  skills:
    - land-a-branch
    - git
  overridable:
    - fence
  harness: claude
  output:
    path: agents/otto/output.schema.json
  claude:
    model: opus
    effort: high
    context: 200k
    fence:
      permissionMode: auto
      disallowedTools:
        - SendMessage
        - CronCreate
        - CronDelete
        - RemoteTrigger
        - Bash(git push)
        - Bash(git push:*)
        - Bash(gh)
        - Bash(gh:*)
        - Bash(git branch -D:*)
        - Bash(git branch --delete --force:*)
        - Bash(pkill:*)
        - Bash(killall:*)
        - mcp__playwright__browser_run_code_unsafe
        - Bash(claude *--bg*)
        - Bash(claude *--background*)
        - Bash(claude *remote-control*)
        - Edit(//**/.claude/settings.local.json)
        - Edit(~/.claude/settings.json)
        - Edit(~/.claude.json)
        - mcp__github__push_files
        - mcp__github__create_or_update_file
        - mcp__github__delete_file
        - mcp__github__create_branch
        - mcp__github__create_repository
        - mcp__github__fork_repository
        - mcp__github__actions_run_trigger
        - Edit(${{ parameters.storeRoot }}/factories/**)
        - Edit(${{ parameters.storeRoot }}/workflows/**)
        - Edit(${{ parameters.storeRoot }}/inbox/**)
        - Write(${{ parameters.storeRoot }}/factories/**)
        - Write(${{ parameters.storeRoot }}/workflows/**)
        - Write(${{ parameters.storeRoot }}/inbox/**)
