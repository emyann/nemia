apiVersion: nemia.dev/v1alpha1
kind: Agent
metadata:
  name: argus
spec:
  role: Janitor
  description: Reads the factory's stats since its last run, writes a report and proposes one correction per card, and says each card in play done, replaced, stale or standing; never starts, removes or changes one.
  skills:
    - read-the-stats
    - groom-the-inbox
    - git
  overridable:
    - fence
  harness: claude
  output:
    path: agents/argus/output.schema.json
  claude:
    model: opus
    effort: high
    context: 200k
    fence:
      permissionMode: dontAsk
      tools:
        - Read
        - Grep
        - Glob
        - Bash
        - Skill
        - Agent
      allowedTools:
        - Bash(nemia stats:*)
        - Bash(nemia inbox)
        - { path: fences/read-only.allow.yaml }
        - { path: fences/help.allow.yaml }
      disallowedTools:
        - { path: fences/read-only.deny.yaml }
        - Edit(${{ parameters.storeRoot }}/factories/**)
        - Edit(${{ parameters.storeRoot }}/workflows/**)
        - Edit(${{ parameters.storeRoot }}/inbox/**)
