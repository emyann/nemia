apiVersion: nemia.dev/v1alpha1
kind: Agent
metadata:
  name: agora
spec:
  role: Code reviewer
  description: Reviews a change as a second engineer would, against its intent and spec, and sends it back for another round while a finding is worth it.
  skills:
    - review-a-change
    - git
  overridable:
    - fence
    - skills
    - mcp
  harness: claude
  output:
    path: agents/agora/output.schema.json
  claude:
    model: opus
    effort: high
    context: 400k
    fence:
      permissionMode: dontAsk
      tools:
        - Read
        - Grep
        - Glob
        - Bash
        - Skill
        - Agent
        - WebFetch
        - WebSearch
      allowedTools:
        - { path: fences/docs.allow.yaml }
        - Agent
        - { path: fences/read-only.allow.yaml }
        - Bash(gh pr view:*)
        - Bash(gh pr checks:*)
        - { path: fences/browser.allow.yaml }
        - mcp__github__pull_request_read
        - mcp__github__list_pull_requests
        - mcp__github__search_pull_requests
        - mcp__github__get_commit
        - mcp__github__list_commits
        - mcp__github__get_file_contents
        - mcp__github__issue_read
        - mcp__github__list_issues
        - mcp__github__actions_get
        - mcp__github__actions_list
        - mcp__github__get_job_logs
      disallowedTools:
        - { path: fences/read-only.deny.yaml }
        - { path: fences/run-code.deny.yaml }
        - { path: fences/browser.deny.yaml }
        - Edit(${{ parameters.storeRoot }}/factories/**)
        - Edit(${{ parameters.storeRoot }}/workflows/**)
        - Edit(${{ parameters.storeRoot }}/inbox/**)
