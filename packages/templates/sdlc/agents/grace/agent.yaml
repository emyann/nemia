apiVersion: nemia.dev/v1alpha1
kind: Agent
metadata:
  name: grace
spec:
  role: Lead software engineer
  description: "Builds the change a spec describes, herself, in one session, with the tests that prove it; answers each review finding in the next round."
  skills:
    - implement-a-change
    - git
  overridable:
    - context
    - output
    - fence
    - skills
    - mcp
  harness: claude
  claude:
    model: opus
    effort: medium
    context: 200k
    fence:
      permissionMode: auto
      disallowedTools:
        - { path: fences/writers.deny.yaml }
        - { path: fences/run-code.deny.yaml }
        - mcp__github__merge_pull_request
        - mcp__github__create_pull_request
        - mcp__github__update_pull_request
        - mcp__github__update_pull_request_branch
        - mcp__github__pull_request_review_write
        - mcp__github__add_comment_to_pending_review
        - mcp__github__add_reply_to_pull_request_comment
        - mcp__github__add_issue_comment
        - mcp__github__update_issue_comment
        - mcp__github__issue_write
        - mcp__github__sub_issue_write
        - mcp__github__assign_copilot_to_issue
        - mcp__github__request_copilot_review
        - Edit(${{ parameters.storeRoot }}/factories/**)
        - Edit(${{ parameters.storeRoot }}/workflows/**)
        - Edit(${{ parameters.storeRoot }}/inbox/**)
