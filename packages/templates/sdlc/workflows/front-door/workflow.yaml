apiVersion: nemia.dev/v1alpha1
kind: Workflow
metadata:
  name: front-door
  description: "Route a raw card to the workflow it needs, with no gate. The front door's trigger queues each card of the factory in the sprint and ready to work (sdlc/stage=sprint and sdlc/state=ready-to-work) that names no workflow; Iris, as a read-only judge, reads the card and sends it as given to intake, build or quick, answers a question with no change to the repository, or files it back to the backlog unqueued, by sdlc/stage=backlog. Where she cannot tell, she signs off blocked and a person answers."
spec:
  steps:
    - name: door
      place: git
      memoryRequest: "${{ parameters.lightMemoryRequest }}"
      routes:
        - intake
        - build
        - quick
        - answer
        - backlog
      route: judge
      output:
        path: workflows/front-door/door.schema.json
      overrides:
        claude:
          fence:
            tools:
              - Read
              - Grep
              - Glob
              - Skill
    - name: to-intake
      after:
        - door
      place: git
      when:
        - intake
      workflow: intake
      card: given
    - name: to-build
      after:
        - door
      place: git
      when:
        - build
      workflow: build
      card: given
    - name: to-quick
      after:
        - door
      place: git
      when:
        - quick
      workflow: quick
      card: given
    - name: answer
      after:
        - door
      place: git
      memoryRequest: "${{ parameters.lightMemoryRequest }}"
      when:
        - answer
      output:
        path: workflows/front-door/answer.schema.json
      overrides:
        claude:
          fence:
            tools:
              - Read
              - Grep
              - Glob
              - WebFetch
              - WebSearch
              - Skill
    - name: backlog
      after:
        - door
      place: git
      when:
        - backlog
      card: backlog
      relabel:
        - sdlc/stage=backlog
