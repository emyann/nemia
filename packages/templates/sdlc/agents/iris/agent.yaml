apiVersion: nemia.dev/v1alpha1
kind: Agent
metadata:
  name: iris
spec:
  role: Product engineer
  description: Turns a loose idea into an intent someone can build from, by interviewing the person who had it, a round of questions at a time.
  skills:
    - grilling
    - git
  overridable:
    - output
    - fence
  harness: claude
  output:
    path: agents/iris/output.schema.json
  claude:
    model: opus
    effort: high
    context: 200k
    fence:
      permissionMode: dontAsk
      tools:
        - Read
        - Grep
        - Glob
        - Bash
        - Skill
        - Agent
        - WebFetch
        - WebSearch
      allowedTools:
        - WebSearch
        - WebFetch(domain:code.claude.com)
        - WebFetch(domain:docs.claude.com)
        - WebFetch(domain:platform.claude.com)
        - WebFetch(domain:docs.anthropic.com)
        - Agent
        - Bash(git diff:*)
        - Bash(git diff-tree:*)
        - Bash(git log:*)
        - Bash(git show:*)
        - Bash(git show-ref:*)
        - Bash(git status:*)
        - Bash(git blame:*)
        - Bash(git grep:*)
        - Bash(git ls-files:*)
        - Bash(git ls-tree:*)
        - Bash(git cat-file:*)
        - Bash(git rev-parse:*)
        - Bash(git rev-list:*)
        - Bash(git merge-base:*)
        - Bash(git merge-tree:*)
        - Bash(git shortlog:*)
        - Bash(git describe:*)
        - Bash(git name-rev:*)
        - Bash(git for-each-ref:*)
        - Bash(git check-ignore:*)
        - Bash(git branch)
        - Bash(git branch --list:*)
        - Bash(git branch --contains:*)
        - Bash(git worktree list:*)
        - Bash(wc:*)
        - Bash(cut:*)
        - Bash(head:*)
        - Bash(tail:*)
        - Bash(cat:*)
        - Bash(ls:*)
        - Bash(nemia propose *)
      disallowedTools:
        - Bash(cd:*)
        - Bash(git grep *O*)
        - Bash(git grep *--op*)
        - Bash(*GIT_*)
        - Bash(*=* git *)
        - Bash(git *--output*)
        - Bash(git *--no-ind*)
        - Bash(git blame *--con*)
        - Bash(git grep -f*)
        - Bash(git grep * -f*)
        - Bash(wc *--f*)
        - Bash(gh *--web*)
        - Bash(gh * -w*)
        - Bash(gh *--watch*)
        - Bash(gh *--jq*)
        - Bash(gh * -q*)
        - Bash(gh *--template*)
        - Bash(gh * -t*)
        - Bash(gh *--repo*)
        - Bash(gh * -R*)
        - Bash(gh *//*)
        - Bash(gh * -c*)
        - Bash(*=* gh *)
        - Bash(*=* nemia *)
        - Edit(${{ parameters.storeRoot }}/factories/**)
        - Edit(${{ parameters.storeRoot }}/workflows/**)
        - Edit(${{ parameters.storeRoot }}/inbox/**)
