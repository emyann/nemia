apiVersion: nemia.dev/v1alpha1
kind: Workflow
metadata:
  name: intake
  description: Turn a loose idea into an intent someone can build from. Iris, a product engineer, interviews the person who had the idea, a round of questions at a time, and signs off with the intent once they share an understanding. The person approves it at the gate.
spec:
  steps:
    - name: intake
      place: git
      gate: true
      overrides:
        claude:
          fence:
            disallowedTools:
              - Bash(npm run build)
              - Bash(npm run e2e)
              - Bash(npm test)
              - Bash(npx shadcn@latest:*)
              - Bash(pnpm dlx shadcn@latest:*)
              - Bash(bunx --bun shadcn@latest:*)
              - Bash(node --test:*)
              - Bash(npx turbo run test:*)
              - Bash(npx tsc:*)
              - Bash(npx oxlint:*)
              - Bash(npx tsverify:*)
