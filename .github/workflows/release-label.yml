# The release-label check: a pull request into main carries exactly one release label — breaking, feature, fix, docs or internal
# (tools/release/release.ts, LABELS) — and the refusal names them and the command that adds one. A workflow of its own, not a job of
# ci.yml, so that a label added or taken off reruns this check and not the whole suite. tools/guards/test/release-workflow.test.ts
# holds this file.
name: release-label

# The labels are read on every event that can change them. A dispatch is the release workflow's: it runs this check on the release
# pull request's head, which the workflow's own token pushed and so started no pull_request run. The sibling trigger that would run a
# fork's code against a writable token is named nowhere here.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    branches: [main]
  workflow_dispatch:

# The check reads the code and the pull request's labels, and writes nothing.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-label-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-label:
    name: release-label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 3
      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version: '24.16.0'
      - name: Check the pull request's release label
        if: github.event_name == 'pull_request'
        timeout-minutes: 2
        # The labels and the number come through env, never interpolated into the command line: a label's name is anyone's to write.
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node tools/release/release.ts check
      - name: Check the release label of the open pull request this branch heads
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: node tools/release/release.ts check
