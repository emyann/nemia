# Nemia's own check, on clean runners off the owner's machine (docs/plan-github-ci.md, "5. CI").
#
# A reader of CI has no test to ask, so the reasons are beside the lines. What this file must agree with in the repository — a workspace
# with no leg, a node floor adrift from engines.node, a job outside the gate's needs, an action that is not GitHub's own by major tag —
# is refused by packages/agent-orchestrator/test/ci-workflow.test.ts, not by this comment.
name: ci

# A pull request is tested by pull_request, which runs the fork's code against a token that can only read. The sibling trigger that
# would run it against a writable token is named nowhere in this file, and ci-workflow.test.ts refuses the word anywhere in its text.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository: the token reads the code and no more.
permissions:
  contents: read

# A superseded run of a branch is cancelled, but every push to main keeps its run to its end: the gate below reads a cancelled job as a
# failure, so cancelling main's run would leave a landed commit red without having been tested.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test ${{ matrix.workspace }} on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      # Every leg runs: one package's failure on one node says nothing about the other nine.
      fail-fast: false
      matrix:
        workspace: [agent-runtime, agent-orchestrator, api, web, docs]
        # Quoted, both of them: YAML reads 22.18 as a number and setup-node then installs the wrong Node. 22.18.0 is the floor
        # engines.node claims; 24 is the release after it.
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        # No cache: npm — the lockfile's own install is part of what is under test, and a cache keyed across legs hides a broken one.
        with:
          node-version: ${{ matrix.node }}
      - name: Give the runner a git identity
        # A runner has none, and its git init would default to master. Much of the suite makes scratch repositories; the ones that pass
        # -c user.email and -b main themselves do not need this, and the ones that do not need the runner to resemble a person's machine.
        run: |
          git config --global user.name 'nemia ci'
          git config --global user.email 'ci@nemia.invalid'
          git config --global init.defaultBranch main
      - run: npm ci
      # Both runs pass --force: turbo.json hashes no environment (envMode loose passes it through without hashing it), so without it the
      # second run replays the first from the cache and the second timezone is never tested.
      - name: test under TZ=UTC
        run: npx turbo run test --force --filter=${{ matrix.workspace }}
        env:
          TZ: UTC
      - name: test under TZ=America/New_York
        run: npx turbo run test --force --filter=${{ matrix.workspace }}
        env:
          TZ: America/New_York

  lint:
    # Whole, and on the floor engines.node claims: the linter's verdict does not differ by node, so one leg is enough.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
      - run: npm ci
      - run: npm run lint

  typecheck:
    # Whole, on the same floor: tsc reads the repository's own TypeScript, not the runtime's.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
      - run: npm ci
      - run: npm run typecheck

  e2e:
    name: e2e shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs: one shard's failing page says nothing about the other three, and the bound below needs every shard's times.
      fail-fast: false
      matrix:
        # 1 to 4, contiguous: the run takes its count off strategy.job-total, so the count is written here and nowhere else, and the
        # runner refuses a shard outside 1..n. ci-workflow.test.ts refuses a list that is not 1..n in order.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        # No cache: npm, as the legs above.
        with:
          node-version: '22.18.0'
      - run: npm ci
      - name: Cache Playwright's browsers
        # Keyed on the lockfile, which pins playwright: a dependency change downloads Chromium again, which is minutes and not
        # correctness. The restore-key gives a near miss the last build rather than none.
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Chromium
        # From the checkout's own playwright, never an npx download, as apps/web/CLAUDE.md says: an install from elsewhere deletes the
        # builds of every Playwright it does not see. --with-deps runs apt even on a cache hit, which is minutes and not correctness.
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Visit this shard's pages
        # The shard is the leg's own and the count is read back off the matrix: a literal here would leave a shard's pages unvisited the
        # day the matrix changes. A shard is a run of some pages, so it is held to no bound itself; the bound is the e2e-bound job's.
        run: npm run e2e -- --shard ${{ matrix.shard }} --of ${{ strategy.job-total }}
        env:
          # The e2e writes its pictures and this shard's page times here (OUT, apps/web/test/e2e/world.ts).
          WF_ARTIFACTS: ${{ github.workspace }}/.e2e
      - name: Upload this shard's page times
        # On a pass alone: run.ts writes the file after the pages passed, so a failing shard has none to upload — and the bound job
        # below then names that shard and the command to run again, rather than summing less than the whole silently. if-no-files-found:
        # error — a shard that passed and wrote no times is a broken runner, not a quiet success.
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: pages-${{ matrix.shard }}-of-${{ strategy.job-total }}
          path: .e2e/pages-*.json
          if-no-files-found: error
      - name: Upload the failing pages' pictures
        # Only a failure's: a passing run with no --photos takes no picture but a failing page's, and there is nothing to keep.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-shard-${{ matrix.shard }}
          path: .e2e/*.png
          if-no-files-found: ignore

  e2e-bound:
    # The whole e2e's page time, summed across the shards and held to PAGES_BOUND_MS — the bound that is additive and that a shard, like
    # --pages, silences inside a run. Its one writer is apps/web/test/e2e/timing.ts: no copy of the number belongs in this file.
    needs: [e2e]
    runs-on: ubuntu-latest
    # Whatever the shards did: a shard that failed still uploaded its times, and this job names a shard that wrote none rather than
    # summing less than the whole.
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
      - name: Download every shard's page times
        uses: actions/download-artifact@v8
        with:
          pattern: pages-*-of-*
          merge-multiple: true
          path: .e2e
      - name: Sum the shards' page time against the whole run's bound
        # No npm ci: the command imports node and the e2e's own files, nothing installed.
        run: node apps/web/test/e2e/pages-bound.ts .e2e

  build:
    # The board builds, and the two paths a generator writes are the bytes that are committed. A stale one is green here without this
    # job and red on the next person's typecheck.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
      - run: npm ci
      # Writes apps/web/src/routeTree.gen.ts, which a new route file needs before typecheck passes.
      - run: npm run build
      # Writes apps/web/theme/, which is generated from DESIGN.md and never edited (the kit's generator, recorded in apps/web/package.json).
      - run: npm run theme:generate --workspace web
      - name: Refuse a stale generated file
        # Run, not read: ci-build.boundary.test.ts runs this very script in a scratch repository, since a git diff that forgets to fail
        # reads like one that does and differs exactly where a stale file would report green. The paths are GENERATED in ci-workflow.ts.
        #
        # add -N first: a generator writes a file as readily as it rewrites one, and git diff reports tracked paths alone, so a new
        # apps/web/theme/*.css that nobody committed would be invisible to the diff and the step would pass over a path missing a file
        # its generator writes. Intent-to-add puts such a file in the diff under its own name, which is what the message below prints,
        # and it respects .gitignore, so nothing ignored can be mistaken for a stale file.
        run: |
          git add -N -- apps/web/src/routeTree.gen.ts apps/web/theme/
          stale=$(git -c core.quotePath=false diff --name-only -- apps/web/src/routeTree.gen.ts apps/web/theme/)
          if [ -n "$stale" ]; then
            echo "ci: these generated files are not the bytes their generator writes:" >&2
            echo "$stale" | sed 's/^/ci:   /' >&2
            echo "ci: apps/web/src/routeTree.gen.ts is written by \`npm run build\`, and apps/web/theme/ by" >&2
            echo "ci: \`npm run theme:generate --workspace web\` (never edited by hand: it is generated from apps/web/DESIGN.md)." >&2
            echo "ci: Run the one that writes each, from the repository root, and commit what it changed." >&2
            exit 1
          fi
          echo "ci: the generated files are the bytes their generators write."

  # The one context branch protection requires. It needs every other job, so protection is configured once and never touched as the job
  # list changes, and always() makes it run even when one of them fails, is skipped or is cancelled — each of which it reads as a failure.
  ci:
    runs-on: ubuntu-latest
    if: always()
    needs: [test, lint, typecheck, e2e, e2e-bound, build]
    steps:
      - name: Every job succeeded
        # toJSON(needs) goes through env, never interpolated into the shell: on a pull request from a fork, an expression the branch
        # controls must not reach a command line.
        env:
          RESULTS: ${{ toJSON(needs) }}
        # A whitelist, never a list of the words that mean failure: every result must read success. A job that ends in a state nobody
        # here foresaw, and a RESULTS that arrives empty or in another shape, are failures too — they are the cases a list of known
        # bad words would wave through, green, on a landing nothing tested.
        run: |
          echo "$RESULTS"
          results=$(printf '%s' "$RESULTS" | grep -o '"result": *"[^"]*"' | sed 's/^"result": *"//; s/"$//')
          if [ -z "$results" ]; then
            echo "ci: read no job result out of needs, so nothing here was checked. Give this step env RESULTS: the toJSON of needs," >&2
            echo "ci: and list every job in the ci job's needs, in .github/workflows/ci.yml." >&2
            exit 1
          fi
          for result in $results; do
            if [ "$result" != success ]; then
              echo "ci: a job above ended $result, not success. Open this run's summary, read that job's log, and fix what it names;" >&2
              echo "ci: a cancelled or skipped job is a failure too - re-run the workflow once its cause is gone." >&2
              exit 1
            fi
          done
          echo "ci: every job above succeeded."
