# Nemia's own check, on clean runners off the owner's machine (docs/plan-github-ci.md, "5. CI").
#
# A reader of CI has no test to ask, so the reasons are beside the lines. What this file must agree with in the repository — a workspace
# with no leg, a node floor adrift from engines.node, a job outside the gate's needs, an action that is not GitHub's own by major tag,
# a set of shards that does not tile a suite, a second timezone run for a workspace that reads no local time —
# is refused by tools/guards/test/ci-workflow.test.ts, not by this comment.
name: ci

# A pull request is tested by pull_request, which runs the fork's code against a token that can only read. The sibling trigger that
# would run it against a writable token is named nowhere in this file, and ci-workflow.test.ts refuses the word anywhere in its text.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository: the token reads the code and no more.
permissions:
  contents: read

# A superseded run of a branch is cancelled, but every push to main keeps its run to its end: the gate below reads a cancelled job as a
# failure, so cancelling main's run would leave a landed commit red without having been tested.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every job, and every step that reaches the network (an action, npm ci, the Chromium install, a curl), carries a timeout-minutes of its
# own: without one GitHub waits 360 minutes, and a stalled Chromium download held a run for over 30 before a person cancelled it
# (Actions run 39767847275). Each bound is read off the step times of 12 green ci runs of 2026-10-22 and set well above the slowest:
# an action took 17 s at most and is bounded at 5 minutes, npm ci 39 s at 10, the Chromium install 469 s (a cache miss; 15 s on a
# hit) at 15, an e2e shard 802 s at 30, a test leg 247 s at 20, every other job under 100 s at 15 or less. A step that stalls fails
# with GitHub's own line naming it, "has timed out after N minutes", and `gh run rerun --failed` answers it. A step's bound stays
# under its job's, or the job's fires first and names no step. ci-workflow.test.ts refuses a job or a network step without a bound.
jobs:
  test:
    # The shard is empty on every leg but the orchestrator's, where it reads ' 1/2' or ' 2/2': two shards of one workspace on one node
    # must read apart in the run's summary, or a person cannot tell which half failed.
    name: test ${{ matrix.workspace }} on node ${{ matrix.node }} ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every leg runs: one package's failure on one node says nothing about the other eleven.
      fail-fast: false
      matrix:
        # The orchestrator is not here: its suite is run in halves, and a matrix cannot split one combination, so its four legs arrive
        # through include below.
        workspace: [agent-runtime, api, web, docs]
        # Quoted, both of them: YAML reads 24.16 as a number and setup-node then installs the wrong Node. 24.16.0 is the floor
        # engines.node claims; 24 is its line's latest.
        node: ['24.16.0', '24']
        # The orchestrator's suite is the longest of the five (766 s for its leg's two passes, measured over 8 ci runs on 2026-10-21),
        # so it runs in two halves. An include entry whose workspace the axis above does not name cannot be added to a combination, so
        # GitHub makes a leg of its own of it: four legs here, two nodes by two halves. Each half is named <i>/2, which is what
        # node --test-shard takes, and the fractions must tile 1..n of n or a half of the suite is run by nobody.
        include:
          - workspace: agent-orchestrator
            node: '24.16.0'
            shard: '1/2'
          - workspace: agent-orchestrator
            node: '24.16.0'
            shard: '2/2'
          - workspace: agent-orchestrator
            node: '24'
            shard: '1/2'
          - workspace: agent-orchestrator
            node: '24'
            shard: '2/2'
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
      - uses: actions/setup-node@v7
        timeout-minutes: 5
        # No cache: npm — the lockfile's own install is part of what is under test, and a cache keyed across legs hides a broken one.
        with:
          node-version: ${{ matrix.node }}
      - name: Give the runner a git identity
        # A runner has none, and its git init would default to master. Much of the suite makes scratch repositories; the ones that pass
        # -c user.email and -b main themselves do not need this, and the ones that do not need the runner to resemble a person's machine.
        run: |
          git config --global user.name 'nemia ci'
          git config --global user.email 'ci@nemia.invalid'
          git config --global init.defaultBranch main
      - run: npm ci
        timeout-minutes: 10
      # Both runs pass --force: turbo.json hashes no environment (envMode loose passes it through without hashing it, WF_TEST_SHARD as
      # well as TZ), so without it the second run replays the first from the cache and the second timezone is never tested.
      #
      # The half this leg runs travels in WF_TEST_SHARD, which the orchestrator's own test script expands into --test-shard before its
      # globs. Not as a turbo `-- --test-shard=1/2` argument: turbo appends that after the script's own arguments, where node has
      # stopped parsing options and reads it as a file pattern instead (options.globPatterns is argv past the first positional). And
      # not through NODE_OPTIONS, which every node child the suite spawns would inherit. On the orchestrator's four legs it reads
      # 1/2 or 2/2 and the hole expands to --test-shard=<i>/2; on every other leg it is empty, the hole expands to nothing and that
      # package's suite runs whole.
      - name: test under TZ=UTC
        run: npx turbo run test --force --filter=${{ matrix.workspace }}
        env:
          TZ: UTC
          WF_TEST_SHARD: ${{ matrix.shard }}
      # The web alone, and the reason is a measurement of 2026-10-21: local time is read in apps/web/src/lib and nowhere else in this
      # repository, and in 54 ci runs the America/New_York pass never failed on its own — each of the 8 failures had already failed
      # under UTC. The web's leg is 47 s a pass, so its second zone is cheap; the measured shape had ten legs, and the second zone of
      # the eight that are not the web's came to 21 runner-minutes a push for a zone no code of theirs can read. A workspace that grows
      # a local-time read needs its second zone back here.
      - name: test under TZ=America/New_York
        if: matrix.workspace == 'web'
        run: npx turbo run test --force --filter=${{ matrix.workspace }}
        env:
          TZ: America/New_York
          WF_TEST_SHARD: ${{ matrix.shard }}

  lint:
    # Whole, and on the floor engines.node claims: the linter's verdict does not differ by node, so one leg is enough.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
      - uses: actions/setup-node@v7
        timeout-minutes: 5
        with:
          node-version: '24.16.0'
      - run: npm ci
        timeout-minutes: 10
      - run: npm run lint

  typecheck:
    # Whole, on the same floor: tsc reads the repository's own TypeScript, not the runtime's.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
      - uses: actions/setup-node@v7
        timeout-minutes: 5
        with:
          node-version: '24.16.0'
      - run: npm ci
        timeout-minutes: 10
      - run: npm run typecheck

  contracts:
    # The contracts under each package's contracts/, verified by tsverify (npm run contracts): any law or obligation not proved,
    # or a contract it cannot read, exits 1. A verdict is decided by the solver's work, not the clock, so one leg on the floor is enough.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
      - uses: actions/setup-node@v7
        timeout-minutes: 5
        with:
          node-version: '24.16.0'
      - run: npm ci
        timeout-minutes: 10
      - run: npm run contracts
        timeout-minutes: 15

  e2e:
    name: e2e shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every shard runs: one shard's failing page says nothing about the other three, and the bound below needs every shard's times.
      fail-fast: false
      matrix:
        # 1 to 4, contiguous: the run takes its count off strategy.job-total, so the count is written here and nowhere else, and the
        # runner refuses a shard outside 1..n. ci-workflow.test.ts refuses a list that is not 1..n in order.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
      - uses: actions/setup-node@v7
        timeout-minutes: 5
        # No cache: npm, as the legs above.
        with:
          node-version: '24.16.0'
      - run: npm ci
        timeout-minutes: 10
      - name: Cache Playwright's browsers
        # Keyed on the lockfile, which pins playwright: a dependency change downloads Chromium again, which is minutes and not
        # correctness. The restore-key gives a near miss the last build rather than none.
        uses: actions/cache@v6
        timeout-minutes: 5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Chromium
        # From the checkout's own playwright, never an npx download, as apps/web/CLAUDE.md says: an install from elsewhere deletes the
        # builds of every Playwright it does not see. --with-deps runs apt even on a cache hit, which is minutes and not correctness.
        run: npx playwright install --with-deps chromium
        timeout-minutes: 15
        working-directory: apps/web
      - name: Visit this shard's pages
        # The shard is the leg's own and the count is read back off the matrix: a literal here would leave a shard's pages unvisited the
        # day the matrix changes. A shard is a run of some pages, so it is held to no bound itself; the bound is the e2e-bound job's.
        run: npm run e2e -- --shard ${{ matrix.shard }} --of ${{ strategy.job-total }}
        env:
          # The e2e writes its pictures and this shard's page times here (OUT, apps/web/test/e2e/world.ts).
          WF_ARTIFACTS: ${{ github.workspace }}/.e2e
      - name: Upload this shard's page times
        # On a pass alone: run.ts writes the file after the pages passed, so a failing shard has none to upload — and the bound job
        # below then names that shard and the command to run again, rather than summing less than the whole silently. if-no-files-found:
        # error — a shard that passed and wrote no times is a broken runner, not a quiet success.
        if: success()
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: pages-${{ matrix.shard }}-of-${{ strategy.job-total }}
          path: .e2e/pages-*.json
          # The e2e writes under .e2e, and upload-artifact skips a dotted path unless it is told not to: without this the upload found
          # no file and if-no-files-found failed every shard that had passed. ci-workflow.test.ts refuses a hidden path without it.
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload the failing pages' pictures
        # Only a failure's: a passing run with no --photos takes no picture but a failing page's, and there is nothing to keep.
        if: failure()
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: e2e-failure-shard-${{ matrix.shard }}
          path: .e2e/*.png
          # As above: .e2e is hidden, so the pictures would be skipped without this — silently here, since nothing is found is ignored.
          include-hidden-files: true
          if-no-files-found: ignore

  e2e-bound:
    # The whole e2e's page time, summed across the shards and held to PAGES_BOUND_MS — the bound that is additive and that a shard, like
    # --pages, silences inside a run. Its one writer is apps/web/test/e2e/timing.ts: no copy of the number belongs in this file.
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Whatever the shards did: a shard that failed still uploaded its times, and this job names a shard that wrote none rather than
    # summing less than the whole.
    if: always()
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
      - uses: actions/setup-node@v7
        timeout-minutes: 5
        with:
          node-version: '24.16.0'
      - name: Download every shard's page times
        uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          pattern: pages-*-of-*
          merge-multiple: true
          path: .e2e
      - name: Sum the shards' page time against the whole run's bound
        # No npm ci: the command imports node and the e2e's own files, nothing installed.
        run: node apps/web/test/e2e/pages-bound.ts .e2e

  build:
    # The board builds, and the two paths a generator writes are the bytes that are committed. A stale one is green here without this
    # job and red on the next person's typecheck.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
      - uses: actions/setup-node@v7
        timeout-minutes: 5
        with:
          node-version: '24.16.0'
      - run: npm ci
        timeout-minutes: 10
      # Writes apps/web/src/routeTree.gen.ts, which a new route file needs before typecheck passes.
      - run: npm run build
      # Writes apps/web/theme/, which is generated from DESIGN.md and never edited (the kit's generator, recorded in apps/web/package.json).
      - run: npm run theme:generate --workspace web
      - name: Refuse a stale generated file
        # Run, not read: ci-build.boundary.test.ts runs this very script in a scratch repository, since a git diff that forgets to fail
        # reads like one that does and differs exactly where a stale file would report green. The paths are GENERATED in ci-workflow.ts.
        #
        # add -N first: a generator writes a file as readily as it rewrites one, and git diff reports tracked paths alone, so a new
        # apps/web/theme/*.css that nobody committed would be invisible to the diff and the step would pass over a path missing a file
        # its generator writes. Intent-to-add puts such a file in the diff under its own name, which is what the message below prints,
        # and it respects .gitignore, so nothing ignored can be mistaken for a stale file.
        run: |
          git add -N -- apps/web/src/routeTree.gen.ts apps/web/theme/
          stale=$(git -c core.quotePath=false diff --name-only -- apps/web/src/routeTree.gen.ts apps/web/theme/)
          if [ -n "$stale" ]; then
            echo "ci: these generated files are not the bytes their generator writes:" >&2
            echo "$stale" | sed 's/^/ci:   /' >&2
            echo "ci: apps/web/src/routeTree.gen.ts is written by \`npm run build\`, and apps/web/theme/ by" >&2
            echo "ci: \`npm run theme:generate --workspace web\` (never edited by hand: it is generated from apps/web/DESIGN.md)." >&2
            echo "ci: Run the one that writes each, from the repository root, and commit what it changed." >&2
            exit 1
          fi
          echo "ci: the generated files are the bytes their generators write."

  gitleaks:
    # The push's or the pull request's new commits, scanned for a secret. The history's own 4,021 commits were audited by hand on
    # 2026-10-19 with this very version and held no secret (docs/plan-github-ci.md, "3. What the history exposes"), so what is left to
    # watch is what arrives — and a range keeps the scan a second long instead of minutes of false positives from the history.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          # The whole history: the range below names a commit before this push, which the shallow default has not, and git refuses a
          # range whose first end it cannot resolve.
          fetch-depth: 0
      - name: Download gitleaks and check it against its release's sha256
        timeout-minutes: 5
        # A pinned download in a run step, never a third party's action: nothing of theirs runs with this token, and the version and
        # the bytes are both this file's. v8.30.1 is the version the owner's audit used. To move it, change both lines below together:
        # take the new hash from gitleaks_<version>_checksums.txt of that release. A release that detects the stub shapes differently
        # is refused by the next step, which is the third place the version is felt - loudly, which is the point.
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Prove the allowlist allows the stubs and nothing wider
        # The one thing .gitleaks.toml's own text cannot say. A top-level [[allowlists]] with a paths entry skips the whole file
        # whatever its condition, so the file's comment can claim a scope the file does not have - which is how the first draft of this
        # card shipped an allowlist that allowed every secret in remote-agent.test.ts, planted tokens included. Only the binary knows,
        # so the binary is asked here on every run, over a fixture of the repository's own shape: the two stub shapes at the allowed
        # path, two controls of other shapes beside them, and a stub shape at a second path. Scanned twice, with the config and
        # without it, and every difference between the two runs is named below.
        #
        # The controls are generated here, not written down, so this file holds no string any gitleaks rule matches. What the step
        # refuses is run rather than read, in tools/guards/test/ci-scan.boundary.test.ts.
        run: |
          fixture=$(mktemp -d)
          # The reports go outside the fixture: a report holds the secrets it found, so one written beside the fixture's files would be
          # scanned by the next run and counted as a finding of its own.
          reports=$(mktemp -d)
          mkdir -p "$fixture/packages/agent-runtime/test"
          # The stub shapes are read out of the file the allowlist is for, never written here: this file then holds no string any
          # gitleaks rule matches, and the fixture is about the strings that test writes today rather than a copy of them that drifts.
          stubs="$fixture/stubs"
          grep -ohE "(tok|key)-[0-9a-f]{4}-SECRET(-[0-9a-f]{4})?" \
            "$GITHUB_WORKSPACE/packages/agent-runtime/test/remote-agent.test.ts" | sort -u > "$stubs"
          want=$(wc -l < "$stubs")
          if [ "$want" -lt 2 ]; then
            echo "ci: packages/agent-runtime/test/remote-agent.test.ts writes $want stub secrets of the shape this allowlist is for, so" >&2
            echo "ci: there is nothing left to allow. Take the [[rules.allowlists]] block out of .gitleaks.toml, and this step with it." >&2
            exit 1
          fi
          allowed="$fixture/packages/agent-runtime/test/remote-agent.test.ts"
          : > "$allowed"
          while read -r stub; do echo "const token = '$stub';" >> "$allowed"; done < "$stubs"
          # Two controls of other shapes beside them, generated here: one of another rule, one of this rule and another shape. Neither
          # may be allowed by an allowlist scoped to the stubs, and both are what the draft's global [[allowlists]] silently allowed.
          echo "const pat = 'ghp_$(openssl rand -hex 18)';" >> "$allowed"
          echo "const apiKey = '$(openssl rand -hex 32)';" >> "$allowed"
          head -1 "$stubs" | while read -r stub; do echo "const token = '$stub';"; done \
            > "$fixture/packages/agent-runtime/test/elsewhere.test.ts"

          # Each scan writes a JSON report whatever it finds. --exit-code is not asked for here: a found secret is what this step wants,
          # so the status says nothing, and a missing report is the only way to tell a scan that failed from one that found nothing.
          scan() {
            report="$reports/$1.json"
            shift
            rm -f "$report"
            (cd "$fixture" && "$GITHUB_WORKSPACE/gitleaks" dir --no-banner --report-format json --report-path "$report" "$@" .) || true
            if [ ! -f "$report" ]; then
              echo "ci: gitleaks wrote no report over the allowlist self-check's fixture, so the scan itself failed and the allowlist" >&2
              echo "ci: was never tested. Read the lines above: the binary is the one downloaded in the step before this." >&2
              exit 1
            fi
          }
          scan bare
          scan configured --config "$GITHUB_WORKSPACE/.gitleaks.toml"

          STUBS='^(tok-[0-9a-f]{4}-SECRET-[0-9a-f]{4}|key-[0-9a-f]{4}-SECRET)$'
          ALLOWED='remote-agent\.test\.ts$'
          OTHER='elsewhere\.test\.ts$'
          # The findings in one file, either of the stub shapes or of any other: the allowlist's two scopes, counted apart.
          found() {
            jq --arg file "$2" --arg stubs "$STUBS" --argjson stub "$3" \
              '[.[] | select(.File | test($file)) | select((.Secret | test($stubs)) == $stub)] | length' "$reports/$1.json"
          }
          rules() { jq -r --arg file "$2" '[.[] | select(.File | test($file)) | .RuleID] | unique | join(" ")' "$reports/$1.json"; }

          bare_stubs=$(found bare "$ALLOWED" true)
          bare_others=$(found bare "$ALLOWED" false)
          bare_elsewhere=$(found bare "$OTHER" true)
          kept_stubs=$(found configured "$ALLOWED" true)
          kept_others=$(found configured "$ALLOWED" false)
          kept_elsewhere=$(found configured "$OTHER" true)
          echo "ci: unconfigured $bare_stubs stub(s) and $bare_others control(s) at the allowed path, $bare_elsewhere elsewhere" \
            "[$(rules bare "$ALLOWED")]; configured $kept_stubs, $kept_others and $kept_elsewhere [$(rules configured "$ALLOWED")]"

          # The fixture writes every stub shape that file holds at the allowed path and two controls beside them, so these are the
          # fixture's own numbers and not gitleaks': what moves them is the release, which is why the sentence sends you to the release.
          if [ "$bare_stubs" -lt "$want" ] || [ "$bare_others" -lt 2 ] || [ "$bare_elsewhere" -lt 1 ]; then
            echo "ci: with no config, gitleaks found $bare_stubs of the $want stub shapes and $bare_others of the 2 controls at the allowed" >&2
            echo "ci: path, and $bare_elsewhere of the 1 stub shape elsewhere. It no longer detects what .gitleaks.toml exists to allow," >&2
            echo "ci: so that allowlist may be dead weight hiding a real secret of the same shape. Re-check the shapes against this" >&2
            echo "ci: release's rules, and narrow or drop the allowlist to what is still detected." >&2
            exit 1
          fi
          if [ "$kept_others" -lt "$bare_others" ]; then
            echo "ci: with .gitleaks.toml, $kept_others of the $bare_others controls at the allowed path are still found: the allowlist" >&2
            echo "ci: is allowing more of that file than the stub shapes, and a real secret pasted in beside them would pass. Write it as" >&2
            echo "ci: a [[rules]] block with id = \"generic-api-key\" carrying one [[rules.allowlists]], never a top-level [[allowlists]]:" >&2
            echo "ci: a global allowlist's paths entry skips the whole file whatever its condition. And check that block carries" >&2
            echo "ci: condition = \"AND\": without it a rule allowlist joins its criteria with OR, so paths alone allows every finding" >&2
            echo "ci: in that file and regexes alone allows a stub's shape anywhere." >&2
            exit 1
          fi
          if [ "$kept_stubs" -ne 0 ]; then
            echo "ci: with .gitleaks.toml, $kept_stubs of the $want stub shapes at the allowed path are still found, so a push that touches" >&2
            echo "ci: packages/agent-runtime/test/remote-agent.test.ts is refused over a secret nobody can use. A regexes entry there no" >&2
            echo "ci: longer matches what the test writes: read the strings it writes and re-anchor the shape, ^...\$, to the bytes" >&2
            echo "ci: gitleaks captures." >&2
            exit 1
          fi
          if [ "$kept_elsewhere" -ne "$bare_elsewhere" ]; then
            echo "ci: with .gitleaks.toml, $kept_elsewhere of the $bare_elsewhere stub shapes outside the allowed path are still found:" >&2
            echo "ci: the allowlist's paths scope reaches past the one file that may hold a stub, so a secret of that shape anywhere in" >&2
            echo "ci: the repository is allowed. Scope paths to the one file, anchored with \$, and nothing wider." >&2
            exit 1
          fi
          echo "ci: the allowlist allows the stub shapes in their one file, and nothing wider."
      - name: Scan this push's new commits
        # The shas come through env and are never interpolated into the command line: on a pull request they are a fork's to name.
        # --redact, because this repository is public and a finding's log is too: the scan says which commit and line, never the secret.
        # --exit-code 2, because gitleaks exits 1 both for a leak and for a failure to scan, and a job that calls a range it could not
        # resolve a found secret says the wrong thing to whoever reads it.
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            range="$BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            range="$BEFORE..$GITHUB_SHA"
          else
            # workflow_dispatch, and a branch's first push, which has no commit before it: the tip's own commit.
            range="$GITHUB_SHA~1..$GITHUB_SHA"
          fi
          echo "ci: scanning $range"
          found=0
          ./gitleaks git --config .gitleaks.toml --log-opts "$range" --redact --no-banner --exit-code 2 . || found=$?
          if [ "$found" -eq 2 ]; then
            echo "ci: gitleaks found a secret in a commit of this push, listed above by file and line (the value itself is redacted)." >&2
            echo "ci: Take it out of the code, rotate it, and rewrite the commit that holds it - a secret pushed once is spent." >&2
            echo "ci: If it is a stub nobody can use, allow its shape and its one file in .gitleaks.toml, and nothing wider." >&2
            exit 1
          fi
          if [ "$found" -ne 0 ]; then
            echo "ci: gitleaks could not scan $range (exit $found), so this push's commits were not read for a secret - and no secret" >&2
            echo "ci: was found. Check that the range's first end resolves in this checkout: a force-push leaves a before that is gone," >&2
            echo "ci: a root commit has no ~1, and the checkout above must keep fetch-depth: 0." >&2
            exit 1
          fi

  guards:
    # The repository's own guards (tools/guards): tests of this file, the docs and the workflows, run only when the push or the pull
    # request touched what they read — the guards#test inputs in turbo.json, or a workspace they depend on — which due.ts decides.
    # The job runs on every event and its suite step alone is skipped: a skipped step leaves the job success, so the gate's whitelist
    # below stands. A workflow-level paths: would skip the whole of ci, the gate with it, and its required context would never report.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          # The whole history: due.ts diffs the range from the commit before this push, or the pull request's base, which the shallow
          # default has not, and a range git cannot resolve is read as due — the suite would run on every event.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        timeout-minutes: 5
        with:
          node-version: '24.16.0'
      - run: npm ci
        timeout-minutes: 10
      - name: Decide whether the guards' suite is due
        id: due
        # The shas come through env, never interpolated into the command line, as the gitleaks scan takes them; GITHUB_EVENT_NAME,
        # GITHUB_SHA and GITHUB_OUTPUT are GitHub's own.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: node tools/guards/due.ts
      - name: test under TZ=UTC
        if: steps.due.outputs.due == 'true'
        run: npx turbo run test --force --filter=guards
        env:
          TZ: UTC

  # The one context branch protection requires. It needs every other job, so protection is configured once and never touched as the job
  # list changes, and always() makes it run even when one of them fails, is skipped or is cancelled — each of which it reads as a failure.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [test, lint, typecheck, contracts, e2e, e2e-bound, build, gitleaks, guards]
    steps:
      - name: Every job succeeded
        # toJSON(needs) goes through env, never interpolated into the shell: on a pull request from a fork, an expression the branch
        # controls must not reach a command line.
        env:
          RESULTS: ${{ toJSON(needs) }}
        # A whitelist, never a list of the words that mean failure: every result must read success. A job that ends in a state nobody
        # here foresaw, and a RESULTS that arrives empty or in another shape, are failures too — they are the cases a list of known
        # bad words would wave through, green, on a landing nothing tested.
        run: |
          echo "$RESULTS"
          results=$(printf '%s' "$RESULTS" | grep -o '"result": *"[^"]*"' | sed 's/^"result": *"//; s/"$//')
          if [ -z "$results" ]; then
            echo "ci: read no job result out of needs, so nothing here was checked. Give this step env RESULTS: the toJSON of needs," >&2
            echo "ci: and list every job in the ci job's needs, in .github/workflows/ci.yml." >&2
            exit 1
          fi
          for result in $results; do
            if [ "$result" != success ]; then
              echo "ci: a job above ended $result, not success. Open this run's summary, read that job's log, and fix what it names;" >&2
              echo "ci: a cancelled or skipped job is a failure too - re-run the workflow once its cause is gone." >&2
              exit 1
            fi
          done
          echo "ci: every job above succeeded."
