apiVersion: nemia.dev/v1alpha1
kind: FactoryTemplate
metadata:
  name: sdlc
  description: "For building software on a repository, each change reviewed before it lands. Five workflows: front-door routes a raw card labelled for it to the workflow it needs, intake turns an idea into an intent with the person, build takes an intent through a written spec, the code and its review to the base branch, quick builds a change its card settles with no spec, and janitor reads how the work went and proposes corrections. Six agents fill their steps: a product engineer, an architect, a lead engineer, a code reviewer, a release engineer and a janitor. A person decides at intake's end, on build's spec and on build's landing, and the front door asks only where it cannot tell; quick lands once its review passes."
spec:
  version: 4.12.0
  rules:
    path: RULES.md
  parameters:
    github:
      type: boolean
      description: "How the factory judges and lands its work. false (the default): with no remote, the implement step's check runs localCheck on each round's tree, and the landing merges the run's result in the repository's own checkout, judged by localCheck on the merged tree. true: the implement step pushes its branch and opens a pull request, its check runs roundCheck and waits on the CI context ciCheck names, and the landing merges that pull request on GitHub; set it with --set github=true. It follows the factory's first writable volume: true where that volume is cloned from github.com, false where it is a folder of the machine or another host's clone; a later volume leaves it as it is. Where neither the pull request's head nor the base branch declares a CI workflow in .github/workflows, the implement step's check runs localCheck in place of the wait, and the landing merges with no context."
      default: false
      whenOrigin: github.com
    localCheck:
      type: string
      description: "The command that judges the work where github is false, from the workspace's root: the implement step's check runs it on each round's tree, and the landing's check on the merged tree. It is the only judge there, so it runs the tests. Where github is true, it judges a round where neither the head nor the base branch declares a CI workflow. The default, carried local-check.ts, runs the repository's lint, typecheck and test scripts by the package manager its --runner names, each where its package.json declares it, leaving out the placeholder test a package manager's init writes, and runs nothing and passes where there is no package.json: it refuses nothing a repository of any kind does not refuse itself."
      default: node "$WF_CARRIED_FILES/local-check.ts" --runner npm
    ciCheck:
      type: string
      description: "The CI status context branch protection requires of the base branch, which the implement step's check waits on and the landing merges on; where landingWaitsOnCi is true, the landing's check then waits on it at the merge commit on the base branch. Read only where github is true."
      default: ci
    landingWaitsOnCi:
      type: boolean
      description: "Whether the landing's check, where github is true, waits on the CI context ciCheck names at the merge commit on the base branch, and fails the step where the merge turned the base red. It needs CI to run on pushes to the base branch: set it false, with --set landingWaitsOnCi=false, where CI does not. Read only where github is true."
      default: true
    landingRefresh:
      type: string
      description: "A command of the factory's own that derives files of its own from the tree (a version, a digest), which the landing runs where the run's branch lacks the base: the landing merges the base into the branch in the run's worktree, runs it there from the worktree's root with the merge in progress, and pushes the result for CI to judge, the land step's check merging it once CI is green there. It resolves and git adds each file it derives, changes nothing else, and exits non-zero naming the fix where it cannot. A merge that differs from git's plain merge outside landingDerives is refused. Read only where github is true. It is written inside a double-quoted shell word, so it holds no quote, no $ and no backtick. Empty (the default) refreshes nothing: a branch that lacks the base lands only where GitHub says it merges as it is."
      default: ""
    landingDerives:
      type: string
      description: "The paths landingRefresh derives, apart by spaces, each a git glob from the repository's root (a * matches no /): the only paths where the landed commit may differ from git's plain merge of the reviewed head and the base, and the only files where the review lets a conflict with the base go, since the landing derives them again. Read only where github is true. It is written inside a double-quoted shell word, so it holds no quote, no $ and no backtick. Empty (the default) names none."
      default: ""
    landingCheckMemory:
      type: string
      description: "The memory the land step's check asks of the machine, a Kubernetes quantity such as 256Mi, by which the daemon admits it while the check holds the repository's checkout: set it where github is true, where the check only waits on GitHub and needs little. The check keeps the daemon's default limit. Empty (the default) asks the daemon's default request, which a check that runs localCheck on the merged tree needs."
      default: ""
    roundCheck:
      type: string
      description: "The command the implement step's check runs on each round's tree before it waits on CI, from the workspace's root: the quick refusal before CI judges. Read only where github is true; where it is false, localCheck judges."
      default: npm run --if-present lint && npm run --if-present typecheck
    implementCheck:
      type: string
      description: "A command of the factory's own that the implement step's check of build and of quick runs on each round's tree, from the workspace's root, either way: after sdlc's own scripts and before anything is pushed or the local check runs, so a non-zero exit refuses the round with nothing pushed. A script of the factory's own is written as node \"$WF_CARRIED_FILES/<script>.ts\", a file the factory keeps once in its carried folder. sh runs it inside { ...; }, so it is a whole command, its quotes and braces balanced. true, the default, checks nothing."
      default: "true"
    pullRequestLabels:
      type: string
      description: "The labels the implement step gives the run's pull request as it opens it, and its check again each round, from the run's own labels: rules apart by spaces, each <key>=<value>:<label>, so kind=bug:bug kind=chore:maintenance labels a run whose kind is bug with bug and one whose kind is chore with maintenance. The labels the rules give the run are added and any other a rule could give is removed; a label no rule gives is left alone, and each label a rule gives must exist in the repository. It is written inside a double-quoted shell word, so it holds no quote, no $ and no backtick. Empty (the default) labels nothing. Read by the pull request only where github is true; the janitor's check reads it either way, filing each card of the factory with labels at least one rule reads, and with none where it is empty."
      default: ""
    areas:
      type: string
      description: The areas a card's title and its area= label name, in the words RULES.md writes them in.
      default: the top-level folders of the repository
    frontDoorLabel:
      type: string
      description: "The label key that sends a card through the front door: each card of the factory that carries it, with any value, and names no workflow is queued on front-door in the order filed, and a labelled card that names its workflow on that one. The door's backlog route files a card back without it. Empty (the default) makes no trigger: front-door then runs only on a card started on it by hand. Set it with --set frontDoorLabel=<key>, a label key as Kubernetes spells one."
      default: ""
    storeRoot:
      type: string
      description: "The Nemia store whose factories, workflows and inbox every agent's fence refuses to edit, written as Claude Code reads a path in a permission rule: ~/ for one under your home, and two slashes for any other absolute path (//srv/nemia), since one slash reads from the settings' folder and the deny would match nothing."
      default: ~/.agent-workflows
  triggers:
    front-door:
      selector: "${{ parameters.frontDoorLabel }}"
      target:
        kind: Workflow
        name: front-door
  hires:
    build/design: seldon
    build/implement: grace
    build/land: otto
    build/review: agora
    front-door/answer: iris
    front-door/door: iris
    intake/intake: iris
    janitor/argus: argus
    quick/implement: grace
    quick/land: otto
    quick/review: agora
