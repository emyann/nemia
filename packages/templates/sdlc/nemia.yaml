apiVersion: nemia.dev/v1alpha1
kind: FactoryTemplate
metadata:
  name: sdlc
  description: "For building software on a repository, each change reviewed before it lands. Five workflows: front-door routes a raw card in the sprint and ready to work (sdlc's own labels, sdlc/stage=sprint and sdlc/state=ready-to-work) to the workflow it needs, intake turns an idea into an intent with the person, build takes an intent through a written spec, the code and its review to the base branch, quick builds a change its card settles with no spec, and janitor reads how the work went and proposes corrections. Five agents fill their steps: a product engineer, an architect, a lead engineer, a code reviewer and a janitor. A person decides at intake's end and on build's spec, and the front door asks only where it cannot tell; build and quick each land once their review passes, by the factory's landing program and with no session. To approve before a landing, gate the review: start the run with --gate review."
spec:
  version: 8.0.2
  rules:
    path: RULES.md
  parameters:
    github:
      type: boolean
      description: "How the factory judges and lands its work. false (the default): with no remote, the implement step's check runs localCheck on each round's tree, and the landing merges the run's result in the repository's own checkout, judged by localCheck on the merged tree. true: the implement step pushes its branch and opens a pull request through the factory's github MCP server, which the factory adds and signs in (the github-server need), and the review step reads it through the same server; its check runs roundCheck, the factory's ci-watch program writes the CI context ciCheck names as a condition the step waits on, and the landing merges that pull request on GitHub; set it with --set github=true. It follows the factory's first writable volume: true where that volume is cloned from github.com, false where it is a folder of the machine or another host's clone; a later volume leaves it as it is. Where neither the pull request's head nor the base branch declares a CI workflow in .github/workflows, the implement step's local check runs localCheck and the program writes the condition True, and the landing merges with no context."
      default: false
      whenOrigin: github.com
    localCheck:
      type: string
      description: "The command that judges the work where github is false, from the workspace's root: the implement step's check runs it on each round's tree, and the landing program on the merged tree. It is the only judge there, so it runs the tests. Where github is true, it judges a round where neither the head nor the base branch declares a CI workflow. The default, carried local-check.ts, runs the repository's lint, typecheck and test scripts by the package manager its --runner names, each where its package.json declares it, leaving out the placeholder test a package manager's init writes, and runs nothing and passes where there is no package.json: it refuses nothing a repository of any kind does not refuse itself. The landing program is handed it inside a single-quoted shell word, so it holds no single quote."
      default: node "$WF_CARRIED_FILES/local-check.ts" --runner npm
    ciCheck:
      type: string
      description: "The CI status context branch protection requires of the base branch, which the ci-watch program watches for the implement step and the land step, and the landing merges on; where landingWaitsOnCi is true, the base-ci condition then reads it at the merge commit on the base branch. Read only where github is true."
      default: ci
    landingWaitsOnCi:
      type: boolean
      description: "Whether the land step's base-ci condition, where github is true, is written from the CI context ciCheck names at the merge commit on the base branch (by the ci-watch program), and fails the step where the merge turned the base red; it holds no checkout. It needs CI to run on pushes to the base branch: set it false, with --set landingWaitsOnCi=false, where CI does not. Read only where github is true."
      default: true
    landingRefresh:
      type: string
      description: "A command of the factory's own that derives files of its own from the tree (a version, a digest), which the landing program runs where the run's branch lacks the base: the landing merges the base into the branch in the run's worktree, runs it there from the worktree's root with the merge in progress, and pushes the result for CI to judge, the condition ci then judging that head, and the landing program merging it once CI is green there. It resolves and git adds each file it derives, changes nothing else, and exits non-zero naming the fix where it cannot. A merge that differs from git's plain merge outside landingDerives is refused. Read only where github is true. It is written inside a double-quoted shell word, so it holds no quote, no $ and no backtick. Empty (the default) refreshes nothing: a branch that lacks the base lands only where GitHub says it merges as it is."
      default: ""
    landingDerives:
      type: string
      description: "The paths landingRefresh derives, apart by spaces, each a git glob from the repository's root (a * matches no /): the only paths where the landed commit may differ from git's plain merge of the reviewed head and the base, and the only files where the review lets a conflict with the base go, since the landing derives them again. Read only where github is true. It is written inside a double-quoted shell word, so it holds no quote, no $ and no backtick. Empty (the default) names none."
      default: ""
    landingInstall:
      type: string
      description: "A command of the factory's own that installs the repository's dependencies as the merged tree names them, which the landing program runs where it refreshes a branch that lacks the base: from the worktree's root, with the merge of the base in progress, after the merge and before landingRefresh, on every refresh, the two sharing one time bound. Without it the refresh runs on what the worktree had installed, the branch's dependencies, or none at all in a scratch worktree where no worktree has the branch checked out. It changes no tracked file, and exits non-zero naming the fix where it cannot: a failed install is refused and the merge taken back, nothing pushed. Read only where github is true and landingRefresh is set. It is written inside a double-quoted shell word, so it holds no quote, no $ and no backtick. Empty (the default) installs nothing."
      default: ""
    lightMemoryRequest:
      type: string
      description: "The memory the sessions of the steps that run no test, build or typecheck ask of the machine, a Kubernetes quantity such as 1Gi, by which the daemon admits them: front-door's door and answer, intake's intake, janitor's argus. Each session keeps its limit, the daemon's default. Read the peaks they reached (nemia stats, and a run's step page) before you set it. Empty asks the daemon's default request."
      default: 1Gi
    roundCheck:
      type: string
      description: "The command the implement step's check runs on each round's tree before CI judges, from the workspace's root: the quick refusal before CI judges. Read only where github is true; where it is false, localCheck judges."
      default: npm run --if-present lint && npm run --if-present typecheck
    implementCheck:
      type: string
      description: "A command of the factory's own that the implement step's check of build and of quick runs on each round's tree, from the workspace's root, either way: after sdlc's own scripts and before anything is pushed or the local check runs, so a non-zero exit refuses the round with nothing pushed. A script of the factory's own is written as node \"$WF_CARRIED_FILES/<script>.ts\", a file the factory keeps once in its carried folder. sh runs it inside { ...; }, so it is a whole command, its quotes and braces balanced. true, the default, checks nothing."
      default: "true"
    pullRequestLabels:
      type: string
      description: "The labels the implement step gives the run's pull request as it opens it, and its check again each round, from the run's own labels: rules apart by spaces, each <key>=<value>:<label>, so kind=bug:bug kind=chore:maintenance labels a run whose kind is bug with bug and one whose kind is chore with maintenance. The labels the rules give the run are added and any other a rule could give is removed; a label no rule gives is left alone, and each label a rule gives must exist in the repository. It is written inside a double-quoted shell word, so it holds no quote, no $ and no backtick. Empty (the default) labels nothing. Read by the pull request only where github is true; the janitor's check reads it either way, filing each card of the factory with labels at least one rule reads, and with none where it is empty."
      default: ""
    labelValues:
      type: string
      description: "The values filing takes for each label key the factory names, as key=value words apart by spaces, so work=feature work=fix takes work=feature and work=fix and refuses any other work=, while a key it names not is free. A card filed, applied or labelled, a run labelled and a start's own labels that give such a key another value are refused at that moment, nothing written. List here the values pullRequestLabels reads, so a card is refused when it is filed rather than when its run reaches the pull request. Empty (the default) refuses nothing."
      default: ""
    radiusAgentFacing:
      type: string
      description: "The files a branch changes that its agents read as instructions, globs apart by spaces: nemia decide lists a changed one as agent-facing, since a change to it changes every step after it. A folder is written with a trailing /. Empty names none."
      default: "**/CLAUDE.md **/AGENTS.md **/.claude/ **/.codex/ **/.mcp.json **/README.md"
    radiusCheckAffecting:
      type: string
      description: "The files a branch changes that decide what its checks mean, globs apart by spaces: nemia decide lists a changed one as check-affecting and shows its whole diff, since a change could edit one to make its check pass. Name the repository's check scripts, its dependencies, its compiler and lint settings and its tests. A folder is written with a trailing /. Empty names none."
      default: "**/package.json **/package-lock.json **/tsconfig*.json **/*.test.* **/test/"
    radiusLessons:
      type: string
      description: "The files where the next agent reads what this one learned, globs apart by spaces: nemia decide's lesson line counts a changed one. A folder is written with a trailing /. Empty names none, and the lesson line says nothing was written."
      default: "**/CLAUDE.md **/AGENTS.md docs/"
    areas:
      type: string
      description: The areas a card's title and its area= label name, in the words RULES.md writes them in.
      default: the top-level folders of the repository
    storeRoot:
      type: string
      description: "The Nemia store whose factories, workflows and inbox every agent's fence refuses to edit, written as Claude Code reads a path in a permission rule: ~/ for one under your home, and two slashes for any other absolute path (//srv/nemia), since one slash reads from the settings' folder and the deny would match nothing."
      default: ~/.agent-workflows
  labelValues: "${{ parameters.labelValues }}"
  radius:
    agentFacing: "${{ parameters.radiusAgentFacing }}"
    checkAffecting: "${{ parameters.radiusCheckAffecting }}"
    lessons: "${{ parameters.radiusLessons }}"
  firstWorkflow: quick
  triggers:
    front-door:
      selector: "sdlc/stage=sprint,sdlc/state=ready-to-work"
      target:
        kind: Workflow
        name: front-door
  hires:
    build/design: seldon
    build/implement: grace
    build/review: agora
    front-door/answer: iris
    front-door/door: iris
    intake/intake: iris
    janitor/argus: argus
    janitor/file-cards: argus
    quick/implement: grace
    quick/review: agora
