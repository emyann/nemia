# What the secret scan allows, and nothing more (the gitleaks job in .github/workflows/ci.yml).
#
# gitleaks' own rules are what scan; this file adds one allowlist, for the stub secrets a test of the runtime writes on purpose — a
# token and two keys it sends to a loopback server to prove the secret reaches the harness and is written nowhere else. They are
# generic-api-key findings by entropy, and they are in the only file that may hold one.
#
# Scoped by path AND by shape: a secret of another shape in that file is a finding, and a string of these shapes anywhere else is a
# finding too. packages/agent-orchestrator/test/ci-workflow.test.ts refuses a regex here that matches none of that file's stub
# secrets, and one that matches a line of any other file.
[extend]
useDefault = true

[[allowlists]]
description = "the runtime's deliberate stub secrets, in the one test that writes them"
condition = "AND"
paths = ['packages/agent-runtime/test/remote-agent\.test\.ts$']
regexes = ['^tok-[0-9a-f]{4}-SECRET-[0-9a-f]{4}$', '^key-[0-9a-f]{4}-SECRET$']
