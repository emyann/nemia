apiVersion: nemia.dev/v1alpha1
kind: FactoryTemplate
metadata:
  name: sdlc
spec:
  version: 2.12.0
  rules:
    path: RULES.md
  parameters:
    github:
      type: boolean
      description: "How the factory judges and lands its work. false (the default): with no remote, the implement step's check runs localCheck on each round's tree, and the landing merges the run's result in the repository's own checkout, judged by localCheck on the merged tree. true: the implement step pushes its branch and opens a pull request, its check runs roundCheck and waits on the CI context ciCheck names, and the landing merges that pull request on GitHub; set it with --set github=true."
      default: false
    localCheck:
      type: string
      description: "The command that judges the work where github is false, from the workspace's root: the implement step's check runs it on each round's tree, and the landing's check on the merged tree. It is the only judge there, so it runs the tests. Not read where github is true."
      default: npm run --if-present lint && npm run --if-present typecheck && npm run --if-present test
    ciCheck:
      type: string
      description: "The CI status context branch protection requires of the base branch, which the implement step's check waits on and the landing merges on; where landingWaitsOnCi is true, the landing's check then waits on it at the merge commit on the base branch. Read only where github is true."
      default: ci
    landingWaitsOnCi:
      type: boolean
      description: "Whether the landing's check, where github is true, waits on the CI context ciCheck names at the merge commit on the base branch, and fails the step where the merge turned the base red. It needs CI to run on pushes to the base branch: set it false, with --set landingWaitsOnCi=false, where CI does not. Read only where github is true."
      default: true
    roundCheck:
      type: string
      description: "The command the implement step's check runs on each round's tree before it waits on CI, from the workspace's root: the quick refusal before CI judges. Read only where github is true; where it is false, localCheck judges."
      default: npm run --if-present lint && npm run --if-present typecheck
    implementCheck:
      type: string
      description: "A command of the factory's own that the implement step's check of build and of quick runs on each round's tree, from the workspace's root, either way: after sdlc's own scripts and before anything is pushed or the local check runs, so a non-zero exit refuses the round with nothing pushed. A script of the factory's own is written as node \"$WF_WORKFLOW_FILES/<script>.ts\", a file the factory keeps in both workflows' folders. sh runs it inside { ...; }, so it is a whole command, its quotes and braces balanced. true, the default, checks nothing."
      default: "true"
    pullRequestLabels:
      type: string
      description: "The labels the implement step gives the run's pull request as it opens it, and its check again each round, from the run's own labels: rules apart by spaces, each <key>=<value>:<label>, so kind=bug:bug kind=chore:maintenance labels a run whose kind is bug with bug and one whose kind is chore with maintenance. The labels the rules give the run are added and any other a rule could give is removed; a label no rule gives is left alone, and each label a rule gives must exist in the repository. It is written inside a double-quoted shell word, so it holds no quote, no $ and no backtick. Empty (the default) labels nothing. Read only where github is true."
      default: ""
    areas:
      type: string
      description: The areas a card's title and its area= label name, in the words RULES.md writes them in.
      default: the top-level folders of the repository
    storeRoot:
      type: string
      description: "The Nemia store whose factories, workflows and inbox every agent's fence refuses to edit, written as Claude Code reads a path in a permission rule: ~/ for one under your home, and two slashes for any other absolute path (//srv/nemia), since one slash reads from the settings' folder and the deny would match nothing."
      default: ~/.agent-workflows
  hires:
    build/design: seldon
    build/implement: grace
    build/land: otto
    build/review: agora
    intake/intake: iris
    janitor/argus: argus
    quick/implement: grace
    quick/land: otto
    quick/review: agora
