# The release-label check: a pull request into main carries exactly one release label — breaking, feature, fix, docs or internal
# (tools/release/release.ts, LABELS) — and the refusal names them and the command that adds one. A workflow of its own, not a job of
# ci.yml, so that a label added or taken off reruns this check and not the whole suite. tools/guards/test/release-workflow.test.ts
# holds this file.
name: release-label

# The check runs on every event that can change the labels, and reads them live by the pull request's number: a run a person approves
# later (the release pull request's, whose head the workflow's own token pushed) reads the labels it has then, not its event's
# payload. No dispatch: a dispatched run never counts for a pull request. The sibling trigger that would run a fork's code against a
# writable token is named nowhere here.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    branches: [main]

# The check reads the code and the pull request's labels, and writes nothing.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-label-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-label:
    name: release-label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 3
      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version: '24.16.0'
      - name: Check the pull request's release label
        timeout-minutes: 3
        # The number comes through env, never interpolated into the command line, and the labels are read from the API with it.
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node tools/release/release.ts check
